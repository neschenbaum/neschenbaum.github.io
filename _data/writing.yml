    - year: 2026
      title: "Market Power and Switching Costs in the Foundation Models Market: Evidence from an Enterprise Survey"
      venue: Research note, European AI & Society Fund Global Fellowship
      summary: >-
        Evidence from a survey of 19 organizations with production AI deployments on which providers they use, how hard it
        would be to switch, and what keeps them locked in.
      links:
        - label: Read
